name: Research evidence bridge

on:
  push:
    branches: [research/flow-state-metrics-v0]
    paths:
      - 'scripts/research_*.py'
      - 'scripts/tests/test_research_*.py'
      - '.github/workflows/research-evidence-bridge.yml'
  pull_request:
    paths:
      - 'scripts/research_*.py'
      - 'scripts/tests/test_research_*.py'
      - '.github/workflows/research-evidence-bridge.yml'

permissions:
  contents: read

concurrency:
  group: research-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contracts:
    if: github.repository == 'kvnloo/activitywatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependency
        run: python -m pip install pytest==9.0.2
      - name: Synthetic privacy, calendar, and interoperability contracts
        run: python -m pytest scripts/tests/test_research_*.py -q
